<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R3R Clock — Sharp A/B Test</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #clockFrame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .ab-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 999999;
            display: flex;
            gap: 6px;
            padding: 6px;
            border: 1px solid #444;
            border-radius: 9px;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(8px);
        }
        .ab-panel button {
            min-height: 34px;
            padding: 5px 10px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #111;
            color: #ddd;
            font-weight: 700;
            cursor: pointer;
        }
        .ab-panel button.active {
            border-color: #ff9800;
            color: #ffb74d;
        }
    </style>
</head>
<body>
    <iframe id="clockFrame" src="./index.html" title="R3R Clock"></iframe>
    <div class="ab-panel" aria-label="Comparação de renderização">
        <button id="originalBtn" type="button">ORIGINAL</button>
        <button id="sharpBtn" type="button" class="active">SHARP</button>
    </div>

    <script>
        const frame = document.getElementById('clockFrame');
        const originalBtn = document.getElementById('originalBtn');
        const sharpBtn = document.getElementById('sharpBtn');
        const STYLE_ID = 'r3r-sharp-test-style';

        const sharpCSS = `
            #clockSvg {
                shape-rendering: geometricPrecision !important;
                text-rendering: geometricPrecision !important;
            }
            #clockSvg text {
                text-rendering: optimizeLegibility !important;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            #clockSvg .tick-line {
                stroke-width: 2.15 !important;
            }
            #clockSvg .tick-line-sub {
                stroke-width: 1.20 !important;
            }
            #clockSvg .market-arc,
            #clockSvg .guide-ring,
            #clockSvg .preopen-arc,
            #clockSvg .hand,
            #clockSvg line,
            #clockSvg circle,
            #clockSvg path {
                shape-rendering: geometricPrecision !important;
            }
        `;

        function setMode(mode) {
            const doc = frame.contentDocument;
            if (!doc) return;
            let style = doc.getElementById(STYLE_ID);
            if (mode === 'sharp') {
                if (!style) {
                    style = doc.createElement('style');
                    style.id = STYLE_ID;
                    style.textContent = sharpCSS;
                    doc.head.appendChild(style);
                }
                sharpBtn.classList.add('active');
                originalBtn.classList.remove('active');
            } else {
                if (style) style.remove();
                originalBtn.classList.add('active');
                sharpBtn.classList.remove('active');
            }
        }

        frame.addEventListener('load', () => setMode('sharp'));
        originalBtn.addEventListener('click', () => setMode('original'));
        sharpBtn.addEventListener('click', () => setMode('sharp'));
    </script>
</body>
</html>
