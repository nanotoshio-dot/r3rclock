<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.svg">
    <title>Relógio Global 24h - PRO Multilanguage + Skins</title>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>

    <!-- Vercel Speed Insights -->

        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>

    <style>
        /* Temas de Cores (As 10 Skins) */
        body.skin-cyberpunk {
            --bg-color: #05050a;
            --text-main: #00ffcc;
            --text-dim: #708090;
            --panel-bg: #0b0b14;
            --panel-border: #ff007f33;
            --accent-color: #ff007f;
            --accent-orange: #00ffcc;
            --clock-ring: #ff007f;
            --tick-main: #00ffcc;
            --tick-sub: #1f1f3a;
        }

        body.skin-emerald {
            --bg-color: #020804;
            --text-main: #e0f2fe;
            --text-dim: #64748b;
            --panel-bg: #06150b;
            --panel-border: #14532d;
            --accent-color: #22c55e;
            --accent-orange: #4ade80;
            --clock-ring: #22c55e;
            --tick-main: #4ade80;
            --tick-sub: #0f2918;
        }

        body.skin-crimson {
            --bg-color: #080202;
            --text-main: #fee2e2;
            --text-dim: #7f1d1d;
            --panel-bg: #150606;
            --panel-border: #7f1d1d55;
            --accent-color: #ef4444;
            --accent-orange: #f87171;
            --clock-ring: #ef4444;
            --tick-main: #f87171;
            --tick-sub: #2d0f0f;
        }

        body.skin-solarized {
            --bg-color: #002b36;
            --text-main: #839496;
            --text-dim: #586e75;
            --panel-bg: #073642;
            --panel-border: #586e7544;
            --accent-color: #b58900;
            --accent-orange: #cb4b16;
            --clock-ring: #2aa198;
            --tick-main: #93a1a1;
            --tick-sub: #0a4856;
        }

        body.skin-monochrome {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-dim: #666666;
            --panel-bg: #111111;
            --panel-border: #333333;
            --accent-color: #ffffff;
            --accent-orange: #cccccc;
            --clock-ring: #ffffff;
            --tick-main: #ffffff;
            --tick-sub: #222222;
        }

        body.skin-sunset {
            --bg-color: #0d0612;
            --text-main: #fbcfe8;
            --text-dim: #9d174d;
            --panel-bg: #1a0b24;
            --panel-border: #701a75;
            --accent-color: #ec4899;
            --accent-orange: #f43f5e;
            --clock-ring: #d946ef;
            --tick-main: #f472b6;
            --tick-sub: #2e1037;
        }

        body.skin-matrix {
            --bg-color: #000500;
            --text-main: #4ade80;
            --text-dim: #166534;
            --panel-bg: #000d00;
            --panel-border: #14532d;
            --accent-color: #22c55e;
            --accent-orange: #86efac;
            --clock-ring: #16a34a;
            --tick-main: #22c55e;
            --tick-sub: #052e16;
        }

        body.skin-ocean {
            --bg-color: #020617;
            --text-main: #e2e8f0;
            --text-dim: #475569;
            --panel-bg: #090f24;
            --panel-border: #1e3a8a;
            --accent-color: #38bdf8;
            --accent-orange: #0ea5e9;
            --clock-ring: #0284c7;
            --tick-main: #38bdf8;
            --tick-sub: #0f172a;
        }

        body.skin-gold {
            --bg-color: #0a0802;
            --text-main: #fef08a;
            --text-dim: #854d0e;
            --panel-bg: #171305;
            --panel-border: #713f12;
            --accent-color: #eab308;
            --accent-orange: #facc15;
            --clock-ring: #ca8a04;
            --tick-main: #fde047;
            --tick-sub: #2b2308;
        }

        body.skin-nyse {
            --bg-color: #eef2f7;
            --text-main: #0f172a;
            --text-dim: #64748b;
            --panel-bg: #ffffff;
            --panel-border: #dde3ed;
            --accent-color: #1e40af;
            --accent-orange: #1e3a8a;
            --clock-ring: #2563eb;
            --tick-main: #64748b;
            --tick-sub: #dde3ed;
        }

        /* ── NYSE Wall St: overrides para cores hardcoded ── */
        body.skin-nyse .market-arc.closed {
            stroke: #d1d9e6 !important;
        }
        body.skin-nyse .preopen-arc {
            stroke: #b8c5d8;
        }
        body.skin-nyse #secondHand {
            stroke: #e11d48;
            stroke-width: 1.5;
        }
        body.skin-nyse .card-open .status-badge {
            background: #dcfce7;
            color: #15803d;
            border-color: #86efac;
        }
        body.skin-nyse .card-closed .status-badge {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #fca5a5;
        }
        body.skin-nyse .card-holiday .status-badge {
            background: #fef9c3;
            color: #854d0e;
            border-color: #fde047;
        }
        body.skin-nyse .countdown-timer {
            color: #1d4ed8;
        }
        body.skin-nyse .card-open .countdown-timer {
            color: #1e3a8a;
        }
        body.skin-nyse .market-card:hover {
            border-color: #93c5fd;
            box-shadow: 0 2px 12px rgba(37, 99, 235, 0.1);
        }
        body.skin-nyse .settings-btn:hover {
            background: #f1f5f9;
            border-color: #2563eb;
        }
        body.skin-nyse .ticker-tape-wrapper {
            box-shadow: 0 -2px 12px rgba(15, 23, 42, 0.07);
        }
        body.skin-nyse .side-panel::-webkit-scrollbar-thumb {
            background: #94a3b8;
        }
        body.skin-nyse .card-closing-soon {
            animation: nyse-card-pulse 0.8s ease-in-out infinite alternate;
        }
        @keyframes nyse-card-pulse {
            0%   { border-color: #dde3ed; box-shadow: none; }
            100% { border-color: #e11d48; box-shadow: 0 0 10px 2px rgba(225, 29, 72, 0.15); }
        }
        body.skin-nyse .card-closing-soon .status-badge {
            animation: nyse-badge-blink 0.8s ease-in-out infinite alternate;
        }
        @keyframes nyse-badge-blink {
            0%   { background: #dcfce7; color: #15803d; border-color: #86efac; }
            100% { background: #fee2e2; color: #e11d48; border-color: #fca5a5; }
        }
        body.skin-nyse .arc-closing-soon {
            animation: nyse-arc-pulse 0.8s ease-in-out infinite alternate;
        }
        @keyframes nyse-arc-pulse {
            0%   { stroke-width: 6; filter: none; }
            100% { stroke-width: 9; filter: drop-shadow(0 0 4px #e11d48); }
        }

        /* Default: R3R Classic */
        body,
        body.skin-classic {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-dim: #888888;
            --panel-bg: #0d0d0d;
            --panel-border: #222222;
            --accent-color: #ff6a00;
            --accent-orange: #ff9800;
            --clock-ring: #ff6a00;
            --tick-main: #ffffff;
            --tick-sub: #444444;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .clock-section {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 78px);
            min-height: 400px;
            width: 100%;
            flex-shrink: 0;
            position: relative;
        }

        .heatmap-section {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 78px);
            min-height: 400px;
            width: 100%;
            border-top: 1px solid var(--panel-border);
            background: var(--bg-color);
            padding: 10px;
            flex-shrink: 0;
        }

        .app-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: stretch;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body.cards-only .clock-wrapper {
            display: none;
        }

        body.cards-only .app-container {
            flex-wrap: wrap;
            overflow-y: auto;
            align-content: flex-start;
        }

        body.cards-only .side-panel {
            width: 100% !important;
            flex: 1 1 100%;
            flex-direction: row;
            flex-wrap: wrap;
            align-content: flex-start;
            overflow: visible;
            border: none;
            height: auto;
        }

        body.cards-only .market-card {
            flex: 1 1 220px;
            min-width: 200px;
            padding: 4px 8px;
        }

        body.hide-cards .side-panel {
            display: none;
        }

        /* PAINÉIS LATERAIS REDIMENSIONADOS (285px) PARA 1366x768 */
        .side-panel {
            width: 285px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 2px;
            padding: 4px 8px;
            background: var(--panel-bg);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border-color: var(--panel-border);
        }

        .side-panel::-webkit-scrollbar {
            width: 3px;
        }

        .side-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .side-panel::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 3px;
        }

        .left-panel {
            border-right: 1px solid var(--panel-border);
        }

        .right-panel {
            border-left: 1px solid var(--panel-border);
        }

        .clock-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 0;
            min-width: 0;
            position: relative;
        }

        svg {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1;
            display: block;
        }

        /* Menu de Configurações */
        .settings-container {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 9999;
        }

        .settings-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            font-size: 1.3rem;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            background: #222;
            border-color: var(--accent-orange);
        }

        .settings-menu {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0px -8px 24px rgba(0, 0, 0, 0.9);
            min-width: 170px;
        }

        .settings-menu.show {
            display: flex;
        }

        .settings-menu .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            color: #aaaaaa;
            font-size: 0.72rem;
        }

        .settings-menu select,
        .settings-menu input[type="range"],
        .settings-menu input[type="checkbox"] {
            accent-color: var(--accent-color);
        }

        .settings-menu select {
            background: transparent;
            color: var(--accent-orange);
            border: none;
            border-bottom: 1px dashed var(--accent-orange);
            font-size: 0.72rem;
            padding: 2px 4px;
            cursor: pointer;
            max-width: 100px;
        }

        .settings-menu select:focus {
            outline: none;
        }

        .settings-menu input[type="range"] {
            width: 60px;
            cursor: pointer;
        }

        .settings-menu label {
            cursor: pointer;
            white-space: nowrap;
        }

        /* Partes do Relógio */
        .market-arc {
            fill: none;
            stroke-width: 6;
            stroke-linecap: butt;
            transition: stroke 0.4s ease;
        }

        .guide-ring {
            fill: none;
            stroke: var(--panel-border);
            stroke-width: 6;
        }

        .preopen-arc {
            fill: none;
            stroke: #4a4a4a;
            stroke-width: 6;
            stroke-linecap: butt;
        }

        .market-arc.closed {
            stroke: #2a2a2a !important;
        }

        .arc-text {
            font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
            font-size: 7.0px;
            font-weight: bold;
            fill: var(--text-main);
            letter-spacing: 0.6px;
            pointer-events: none;
        }

        .sun-icon circle {
            fill: #ffd54f;
        }

        .sun-icon.dim circle {
            fill: #777777;
        }

        .tick-line {
            stroke: var(--tick-main);
        }

        .tick-line-sub {
            stroke: var(--tick-sub);
        }

        .hour-text {
            fill: var(--accent-orange);
            font-size: 13px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .minute-text {
            fill: var(--text-dim);
            font-size: 7.5px;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .center-text-large {
            fill: var(--text-main);
            font-size: 20px;
            font-weight: bold;
            text-anchor: middle;
        }

        .center-text-orange {
            fill: var(--accent-orange);
            font-size: 8.5px;
            font-weight: bold;
            text-anchor: middle;
            letter-spacing: 1px;
        }

        .center-text-small {
            fill: var(--text-dim);
            font-size: 8.5px;
            text-anchor: middle;
            letter-spacing: 2px;
        }

        .center-numbers {
            fill: var(--text-main);
            font-size: 7px;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .hand {
            stroke-linecap: round;
            transform-origin: 250px 250px;
        }

        #hourHand {
            stroke: var(--text-main);
            stroke-width: 3;
        }

        #minuteHand {
            stroke: var(--text-dim);
            stroke-width: 2;
        }

        #secondHand {
            stroke: #ff3333;
            stroke-width: 1;
        }

        /* CARDS ULTRA DENSOS E AMPLOS DE 2 LINHAS */
        .market-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 5px;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            flex: 1 1 0;
            min-height: 40px;
            overflow: hidden;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .market-card:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
        }

        .market-title-group {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            min-width: 0;
            flex: 1;
        }

        .market-card .swatch {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .market-card h3 {
            margin: 0;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }

        .market-card .country {
            font-size: 0.70rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex-shrink: 1;
            opacity: 0.85;
        }

        .status-badge {
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }

        .card-open .status-badge {
            background: #1b3320;
            color: #4ade80;
            border: 1px solid #28a745;
        }

        .card-closed .status-badge {
            background: #331b1b;
            color: #ff6b6b;
            border: 1px solid #dc3545;
        }

        .card-holiday .status-badge {
            background: #3d2a10;
            color: #ffb74d;
            border: 1px solid #f57c00;
        }

        .market-card .card-timer {
            display: flex;
            align-items: baseline;
            gap: 4px;
            flex-shrink: 0;
        }

        .countdown-label {
            font-size: 0.62rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .countdown-timer {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.80rem;
            font-weight: 700;
            color: #00d2ff;
            white-space: nowrap;
        }

        .card-open .countdown-timer {
            color: var(--accent-orange);
        }

        /* AVISO DE FECHAMENTO PRÓXIMO - pisca em vermelho */
        .card-closing-soon {
            animation: card-pulse-red 0.8s ease-in-out infinite alternate;
        }

        @keyframes card-pulse-red {
            0% {
                border-color: var(--panel-border);
                box-shadow: none;
            }

            100% {
                border-color: #ff2222;
                box-shadow: 0 0 10px 2px rgba(255, 34, 34, 0.65);
            }
        }

        .card-closing-soon .status-badge {
            animation: badge-blink 0.8s ease-in-out infinite alternate;
        }

        @keyframes badge-blink {
            0% {
                background: #1b3320;
                color: #4ade80;
            }

            100% {
                background: #4a0000;
                color: #ff4444;
                border-color: #ff2222;
            }
        }

        .arc-closing-soon {
            animation: arc-pulse-red 0.8s ease-in-out infinite alternate;
        }

        @keyframes arc-pulse-red {
            0% {
                stroke-width: 6;
                filter: none;
            }

            100% {
                stroke-width: 9;
                filter: drop-shadow(0 0 4px #ff2222);
            }
        }

        .countdown-timer-urgent {
            animation: timer-blink 0.6s ease-in-out infinite alternate;
        }

        @keyframes timer-blink {
            0% {
                color: var(--accent-orange);
            }

            100% {
                color: #ff2222;
            }
        }

        .card-alarms-inline {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .alarm-control {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .alarm-bell {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            line-height: 1;
            padding: 1px;
            opacity: 0.35;
            filter: grayscale(1);
            transition: opacity 0.2s ease;
            flex-shrink: 0;
        }

        .alarm-bell.active {
            opacity: 1;
            filter: none;
        }

        .alarm-bell.ringing {
            animation: bell-ring 0.4s ease-in-out 3;
        }

        @keyframes bell-ring {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(18deg);
            }

            75% {
                transform: rotate(-18deg);
            }
        }

        .alarm-minutes {
            background: transparent;
            color: var(--text-dim);
            border: none;
            border-bottom: 1px dashed var(--text-dim);
            font-size: 0.68rem;
            padding: 0 1px;
            width: 30px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
        }

        .alarm-bell.active+.alarm-minutes,
        .alarm-bell.active~.alarm-minutes {
            color: var(--accent-orange);
            border-bottom-color: var(--accent-orange);
        }

        .ticker-tape-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 78px;
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            z-index: 9999;
            display: block;
            overflow: hidden;
            box-shadow: 0px -2px 10px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {

            body,
            html {
                overflow-y: auto;
            }

            .app-container {
                flex-direction: column;
            }

            .side-panel {
                width: 100% !important;
                height: 110px;
                flex-direction: row;
                overflow-x: auto;
                flex-shrink: 0;
            }

            .market-card {
                min-width: 195px;
                flex: 0 0 auto;
            }

            .clock-section {
                height: auto;
                min-height: 55vh;
            }

            .clock-wrapper {
                width: 100%;
                height: 50vh;
            }
        }
    </style>
</head>

<body class="skin-classic">

    <section class="clock-section">
        <div class="app-container">
            <div class="side-panel left-panel" id="leftPanel"></div>

            <div class="clock-wrapper">
                <svg id="clockSvg" viewBox="0 0 500 500">
                    <defs></defs>
                    <circle cx="250" cy="250" r="250" fill="var(--bg-color)" />
                    <g id="dialGroup"></g>
                    <g id="guideRingsGroup"></g>
                    <g id="preopenGroup"></g>
                    <g id="arcsGroup"></g>

    <script>
        const i18n = {

        let currentLang = localStorage.getItem('r3r_lang_v4') || 'pt';
        if (!i18n[currentLang]) { currentLang = 'pt'; }

        const markets = [
            { id: 'wellington', name: 'NZX', color: '#f57c00', country: { pt: 'Nova Zelândia', es: 'Nueva Zelanda', en: 'New Zealand', fr: 'Nouvelle-Zélande' }, sessions: [{ open: 22.0, close: 4.75 }] },

            { id: 'shenzhen', name: 'SZSE', color: '#ef5350', country: { pt: 'China', es: 'China', en: 'China', fr: 'Chine' }, sessions: [{ open: 1.5, close: 3.5 }, { open: 5.0, close: 7.0 }], preOpen: { open: 1.25, close: 1.5 } },

            { id: 'nse', name: 'NSE', color: '#fdd835', country: { pt: 'Índia', es: 'India', en: 'India', fr: 'Inde' }, sessions: [{ open: 3.75, close: 10.0 }], preOpen: { open: 3.5, close: 3.75 } },
            { id: 'singapore', name: 'SGX', color: '#00acc1', country: { pt: 'Singapura', es: 'Singapur', en: 'Singapore', fr: 'Singapour' }, sessions: [{ open: 1.0, close: 4.0 }, { open: 5.0, close: 9.0 }], preOpen: { open: 0.5, close: 1.0 } },
            { id: 'dubai', name: 'DFM', color: '#8e24aa', country: { pt: 'Emirados Árabes', es: 'Emiratos Árabes', en: 'UAE', fr: 'Émirats arabes' }, sessions: [{ open: 6.0, close: 10.75 }], preOpen: { open: 5.5, close: 6.0 } },
            { id: 'moscow', name: 'MOEX', color: '#1976d2', country: { pt: 'Rússia', es: 'Rusia', en: 'Russia', fr: 'Russie' }, sessions: [{ open: 7.0, close: 15.666 }] },
            { id: 'tadawul', name: 'TADAWUL', color: '#00695c', country: { pt: 'Arábia Saudita', es: 'Arabia Saudita', en: 'Saudi Arabia', fr: 'Arabie saoudite' }, sessions: [{ open: 7.0, close: 12.0 }], preOpen: { open: 6.5, close: 7.0 }, weekendDays: [5, 6] },
            { id: 'frankfurt', name: 'FRANKFURT', color: '#1565c0', country: { pt: 'Alemanha', es: 'Alemania', en: 'Germany', fr: 'Allemagne' }, sessions: [{ open: 7.0, close: 15.5 }], preOpen: { open: 6.0, close: 7.0 } },
            { id: 'euronext', name: 'EURONEXT', color: '#0d47a1', country: { pt: 'França', es: 'Francia', en: 'France', fr: 'France' }, sessions: [{ open: 7.0, close: 15.5 }], preOpen: { open: 5.25, close: 7.0 } },
            { id: 'six', name: 'SIX', color: '#283593', country: { pt: 'Suíça', es: 'Suiza', en: 'Switzerland', fr: 'Suisse' }, sessions: [{ open: 7.0, close: 15.5 }] },
            { id: 'oslo', name: 'OSLO', color: '#3949ab', country: { pt: 'Noruega', es: 'Noruega', en: 'Norway', fr: 'Norvège' }, sessions: [{ open: 7.0, close: 14.5 }] },
            { id: 'london', name: 'LSE', color: '#1a237e', country: { pt: 'Reino Unido', es: 'Reino Unido', en: 'United Kingdom', fr: 'Royaume-Uni' }, sessions: [{ open: 7.0, close: 15.5 }] },
            { id: 'johannesburg', name: 'JSE', color: '#6d4c41', country: { pt: 'África do Sul', es: 'Sudáfrica', en: 'South Africa', fr: 'Afrique du Sud' }, sessions: [{ open: 7.0, close: 15.0 }] },
            { id: 'iceland', name: 'ICEX', color: '#00838f', country: { pt: 'Islândia', es: 'Islandia', en: 'Iceland', fr: 'Islande' }, sessions: [{ open: 9.5, close: 15.5 }] },
            { id: 'saopaulo', name: 'B3', color: '#388e3c', country: { pt: 'Brasil', es: 'Brasil', en: 'Brazil', fr: 'Brésil' }, sessions: [{ open: 13.0, close: 20.0 }] },
            { id: 'newyork', name: 'NYSE', color: '#2e7d32', country: { pt: 'Estados Unidos', es: 'EE. UU.', en: 'United States', fr: 'États-Unis' }, sessions: [{ open: 13.5, close: 20.0 }] },
            { id: 'toronto', name: 'TSX', color: '#43a047', country: { pt: 'Canadá', es: 'Canadá', en: 'Canada', fr: 'Canada' }, sessions: [{ open: 13.5, close: 20.0 }] }
        ];

        const OUTER_RADIUS = 213, INNER_RADIUS = 68;
        const radiusStep = (OUTER_RADIUS - INNER_RADIUS) / (markets.length - 1);
        markets.forEach((m, i) => { m.radius = OUTER_RADIUS - (i * radiusStep); });

        const cx = 250, cy = 250;
        let tzOffset = 0, alarmVolume = 0.8;

        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return { x: centerX + (radius * Math.cos(angleInRadians)), y: centerY + (radius * Math.sin(angleInRadians)) };
        }

        function describeArc(x, y, radius, startAngle, endAngle) {
            const start = polarToCartesian(x, y, radius, endAngle);
            const end = polarToCartesian(x, y, radius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            return ["M", start.x, start.y, "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y].join(" ");
        }

        function describeTextPath(x, y, radius, startAngle, endAngle) {
            const start = polarToCartesian(x, y, radius, startAngle);
            const end = polarToCartesian(x, y, radius, endAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            return ["M", start.x, start.y, "A", radius, radius, 0, largeArcFlag, 1, end.x, end.y].join(" ");
        }

        function sunIcon(pos, extraClass) {
            return `<g class="sun-icon ${extraClass || ''}"><circle cx="${pos.x}" cy="${pos.y}" r="2.1" opacity="0.9" /></g>`;
        }

        function renderDial() {
            const dialGroup = document.getElementById('dialGroup');
            const innerNumbersGroup = document.getElementById('innerNumbersGroup');
            let dialHTML = '';
            for (let i = 0; i < 144; i++) {
                const angle = i * 2.5;
                const isHour = (i % 6 === 0);
                const start = polarToCartesian(cx, cy, isHour ? 238 : 243, angle);
                const end = polarToCartesian(cx, cy, 248, angle);

                dialHTML += `<line x1="${start.x}" y1="${start.y}" x2="${end.x}" y2="${end.y}" class="${isHour ? 'tick-line' : 'tick-line-sub'}" stroke-width="${isHour ? 2 : 1}"/>`;
                if (isHour) {
                    const rawHour = i / 6;
                    let displayHour = ((rawHour + tzOffset) % 24 + 24) % 24;
                    if (displayHour === 0) displayHour = 24;
                    const textPosHour = polarToCartesian(cx, cy, 230, angle);
                    dialHTML += `<text x="${textPosHour.x}" y="${textPosHour.y}" class="hour-text" transform="rotate(${angle}, ${textPosHour.x}, ${textPosHour.y})">${displayHour}</text>`;
                    let displayMin = (rawHour * 60 / 24) % 60;
                    if (rawHour % 2 !== 0) {
                        if (displayMin === 0) displayMin = 60;
                        const textPosMin = polarToCartesian(cx, cy, 218, angle);
                        dialHTML += `<text x="${textPosMin.x}" y="${textPosMin.y}" class="minute-text" transform="rotate(${angle}, ${textPosMin.x}, ${textPosMin.y})">${displayMin}</text>`;
                    }
                }
            }
            dialGroup.innerHTML = dialHTML;
            let innerNumHTML = '';
            [24, 1, 2, 3, 4, 5, 6, 8, 10, 12, 13, 14, 16, 19, 20, 21, 23].forEach(rawH => {
                let displayH = ((rawH + tzOffset) % 24 + 24) % 24;
                if (displayH === 0) displayH = 24;
                const pos = polarToCartesian(cx, cy, 44, rawH * 15);
                innerNumHTML += `<text x="${pos.x}" y="${pos.y}" class="center-numbers">${displayH}</text>`;
            });
            innerNumbersGroup.innerHTML = innerNumHTML;
            const tzLabelEl = document.getElementById('tzLabel');
            if (tzLabelEl) tzLabelEl.textContent = tzOffset === 0 ? 'UTC' : `UTC${tzOffset > 0 ? '+' : ''}${tzOffset}`;
        }

        const ALARM_MINUTE_OPTIONS = [1, 5, 10, 15, 30];
        const alarmMinuteOptionsHTML = ALARM_MINUTE_OPTIONS.map(v => `<option value="${v}">${v}m</option>`).join('');
        const ALARM_STORAGE_KEY = 'r3r_market_alarms_v2';

        function loadAlarmState() { try { const raw = localStorage.getItem(ALARM_STORAGE_KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; } }
        function saveAlarmState() { try { localStorage.setItem(ALARM_STORAGE_KEY, JSON.stringify(alarmState)); } catch (e) { } }

        let alarmState = loadAlarmState();

        function getAlarmEntry(marketId, type) {
            if (!alarmState[marketId]) alarmState[marketId] = {};
            if (!alarmState[marketId][type]) { alarmState[marketId][type] = { enabled: true, minutes: type === 'open' ? 5 : 10, lastFiredTarget: null }; }
            return alarmState[marketId][type];
        }

        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSoftChime() {
            const ctx = getAudioCtx(); const now = ctx.currentTime;
            [880, 1108.73].forEach((freq, i) => {
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.value = freq;
                const start = now + i * 0.14;
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(0.16 * alarmVolume, start + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.9);
                osc.connect(gain).connect(ctx.destination);
                osc.start(start); osc.stop(start + 0.95);
            });
        }

        function triggerAlarm(marketId, type) {
            playSoftChime();
            const bell = document.getElementById(`bell-${type}-${marketId}`);
            if (bell) { bell.classList.add('ringing'); setTimeout(() => bell.classList.remove('ringing'), 1300); }
        }

        function applyAlarmUIState(marketId, type) {
            const entry = getAlarmEntry(marketId, type);
            const bell = document.getElementById(`bell-${type}-${marketId}`);
            const select = document.getElementById(`mins-${type}-${marketId}`);
            if (bell) bell.classList.toggle('active', entry.enabled);
            if (select) select.value = String(entry.minutes);
        }

        function setupAlarmControls() {
            document.querySelectorAll('.alarm-bell').forEach(btn => {
                const handleActivation = (e) => {
                    e.preventDefault();
                    const marketId = btn.dataset.market, type = btn.dataset.type;
                    const entry = getAlarmEntry(marketId, type);
                    entry.enabled = !entry.enabled; entry.lastFiredTarget = null;
                    if (entry.enabled) { try { getAudioCtx(); } catch (e) { } }
                    saveAlarmState(); applyAlarmUIState(marketId, type);
                };
                btn.addEventListener('click', handleActivation);
                btn.addEventListener('touchend', handleActivation);
            });
            document.querySelectorAll('.alarm-minutes').forEach(sel => {
                sel.addEventListener('change', () => {
                    const marketId = sel.dataset.market, type = sel.dataset.type;
                    const entry = getAlarmEntry(marketId, type);
                    entry.minutes = parseInt(sel.value, 10); entry.lastFiredTarget = null;
                    saveAlarmState();
                });
            });
            markets.forEach(m => { applyAlarmUIState(m.id, 'open'); applyAlarmUIState(m.id, 'close'); });
            saveAlarmState();
        }

        function checkMarketAlarms(market, status, totalS, now) {
            const type = status.isOpen ? 'close' : 'open';
            const entry = getAlarmEntry(market.id, type);
            if (!entry.enabled) return;
            const targetKey = Math.round((now.getTime() + status.diffMs) / 1000);
            if (totalS === (entry.minutes * 60) && entry.lastFiredTarget !== targetKey) {
                entry.lastFiredTarget = targetKey; saveAlarmState(); triggerAlarm(market.id, type);
            }
        }

        function initInterface() {
            const arcsGroup = document.getElementById('arcsGroup'), guideGroup = document.getElementById('guideRingsGroup');
            const preopenGroup = document.getElementById('preopenGroup'), iconsGroup = document.getElementById('iconsGroup');
            const svgDefs = document.querySelector('defs'), leftPanel = document.getElementById('leftPanel'), rightPanel = document.getElementById('rightPanel');

            renderDial();
            let arcsHTML = '', guideHTML = '', preopenHTML = '', defsHTML = '', iconsHTML = '', leftCardsHTML = '', rightCardsHTML = '';

            const t = i18n[currentLang];

            markets.forEach((m, index) => {
                guideHTML += `<circle cx="${cx}" cy="${cy}" r="${m.radius}" class="guide-ring" />`;
                m.sessions.forEach((session, sIdx) => {
                    let sDeg = session.open * 15, eDeg = session.close * 15;
                    if (eDeg <= sDeg) eDeg += 360;
                    arcsHTML += `<path id="arc-${m.id}-${sIdx}" d="${describeArc(cx, cy, m.radius, sDeg, eDeg)}" class="market-arc closed" data-color="${m.color}"></path>`;
                    if (sIdx === 0) {
                        defsHTML += `<path id="tpath-${m.id}" d="${describeTextPath(cx, cy, m.radius, sDeg, eDeg)}" />\n`;
                        arcsHTML += `<text class="arc-text"><textPath href="#tpath-${m.id}" startOffset="2%" dy="4.5">${m.name}</textPath></text>`;
                    }
                    iconsHTML += sunIcon(polarToCartesian(cx, cy, m.radius, sDeg)) + sunIcon(polarToCartesian(cx, cy, m.radius, eDeg), 'dim');
                });
                if (m.preOpen) {
                    let pDeg = m.preOpen.open * 15, pEndDeg = m.preOpen.close * 15;
                    if (pEndDeg <= pDeg) pEndDeg += 360;
                    preopenHTML += `<path d="${describeArc(cx, cy, m.radius, pDeg, pEndDeg)}" class="preopen-arc"></path>`;
                }
                const countryName = (typeof m.country === 'object') ? m.country[currentLang] : m.country;
                const cardHTML = `
                    <div class="market-card card-closed" id="card-${m.id}">
                        <div class="card-row card-row-top">
                            <div class="market-title-group">
                                <span class="swatch" style="background:${m.color}"></span>
                                <h3>${m.name}</h3>
                                <span class="country" id="country-${m.id}">${countryName}</span>
                            </div>
                            <div class="status-badge" id="badge-${m.id}">${t.closed}</div>
                        </div>
                        <div class="card-row card-row-bottom">
                            <div class="card-timer">
                                <span class="countdown-label" id="label-${m.id}">${t.opensIn}</span>
                                <span class="countdown-timer" id="timer-${m.id}">--h --m --s</span>
                            </div>
                            <div class="card-alarms-inline">
                                <div class="alarm-control" title="${t.lblOpen}"><button class="alarm-bell" id="bell-open-${m.id}" data-market="${m.id}" data-type="open">🔔</button><select class="alarm-minutes" id="mins-open-${m.id}" data-market="${m.id}" data-type="open">${alarmMinuteOptionsHTML}</select></div>
                                <div class="alarm-control" title="${t.lblClose}"><button class="alarm-bell" id="bell-close-${m.id}" data-market="${m.id}" data-type="close">🔔</button><select class="alarm-minutes" id="mins-close-${m.id}" data-market="${m.id}" data-type="close">${alarmMinuteOptionsHTML}</select></div>
                            </div>
                        </div>
                    </div>`;
                if (index < 10) leftCardsHTML += cardHTML; else rightCardsHTML += cardHTML;
            });
            svgDefs.innerHTML = defsHTML; guideGroup.innerHTML = guideHTML; preopenGroup.innerHTML = preopenHTML;
            arcsGroup.innerHTML = arcsHTML; iconsGroup.innerHTML = iconsHTML;
            leftPanel.innerHTML = leftCardsHTML; rightPanel.innerHTML = rightCardsHTML;
        }

        function updateUITexts() {
            const t = i18n[currentLang];

            const lblLang = document.getElementById('lbl-lang');
            const lblSkin = document.getElementById('lbl-skin');
            const lblTz = document.getElementById('lbl-tz');
            const lblVol = document.getElementById('lbl-vol');
            const lblLayout = document.getElementById('lbl-layout');
            const optFull = document.getElementById('opt-full');
            const optCards = document.getElementById('opt-cards');
            const lblToggle = document.getElementById('lbl-toggle');

            if (lblLang) lblLang.textContent = t.lang;
            if (lblSkin) lblSkin.textContent = t.skin;
            if (lblTz) lblTz.textContent = t.tz;
            if (lblVol) lblVol.textContent = t.vol;
            if (lblLayout) lblLayout.textContent = t.layout;
            if (optFull) optFull.textContent = t.full;
            if (optCards) optCards.textContent = t.cardsOnly;
            if (lblToggle) lblToggle.textContent = t.toggleCards;

            markets.forEach(m => {
                const elCountry = document.getElementById(`country-${m.id}`);
                const elOpen = document.getElementById(`lbl-open-${m.id}`);
                const elClose = document.getElementById(`lbl-close-${m.id}`);

                if (elCountry) elCountry.textContent = (typeof m.country === 'object') ? m.country[currentLang] : m.country;
                if (elOpen) elOpen.textContent = t.lblOpen;
                if (elClose) elClose.textContent = t.lblClose;
            });
        }

        function sameDate(d1, d2) {
            return d1.getUTCFullYear() === d2.getUTCFullYear() &&
                d1.getUTCMonth() === d2.getUTCMonth() &&
                d1.getUTCDate() === d2.getUTCDate();
        }

        function getEaster(year) {
            const a = year % 19, b = Math.floor(year / 100), c = year % 100;
            const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(Date.UTC(year, month - 1, day));
        }

        function getNthDayOfMonth(year, month, dayOfWeek, n) {
            let date = new Date(Date.UTC(year, month, 1)), count = 0;
            while (date.getUTCMonth() === month) {
                if (date.getUTCDay() === dayOfWeek) {
                    count++;
                    if (count === n) return date;
                }
                date.setUTCDate(date.getUTCDate() + 1);
            }
            return null;
        }

        function getLastDayOfWeekOfMonth(year, month, dayOfWeek) {
            let date = new Date(Date.UTC(year, month + 1, 0));
            while (date.getUTCDay() !== dayOfWeek) {
                date.setUTCDate(date.getUTCDate() - 1);
            }
            return date;
        }

        function getVictoriaDay(year) {
            let date = new Date(Date.UTC(year, 4, 24));
            while (date.getUTCDay() !== 1) {
                date.setUTCDate(date.getUTCDate() - 1);
            }
            return date;
        }

        function getObservedDate(year, month, day, mode = 'weekend-shift') {
            let d = new Date(Date.UTC(year, month, day));
            const dow = d.getUTCDay();
            if (mode === 'weekend-shift') {
                if (dow === 0) d.setUTCDate(d.getUTCDate() + 1);
                else if (dow === 6) d.setUTCDate(d.getUTCDate() - 1);
            } else if (mode === 'next-monday') {
                if (dow === 0) d.setUTCDate(d.getUTCDate() + 1);
                else if (dow === 6) d.setUTCDate(d.getUTCDate() + 2);
            }
            return d;
        }

        function isMarketHoliday(dateObj, marketId) {
            const y = dateObj.getUTCFullYear();
            const easter = getEaster(y);
            const goodFriday = new Date(easter.getTime() - 2 * 86400000);
            const easterMonday = new Date(easter.getTime() + 1 * 86400000);

            if (marketId === 'toronto') {
                const holidays = [
                    getObservedDate(y, 0, 1, 'next-monday'),
                    getNthDayOfMonth(y, 1, 1, 3),
                    goodFriday,
                    getVictoriaDay(y),
                    getObservedDate(y, 6, 1, 'next-monday'),
                    getNthDayOfMonth(y, 7, 1, 1),
                    getNthDayOfMonth(y, 8, 1, 1),
                    getNthDayOfMonth(y, 9, 1, 2),
                    getObservedDate(y, 11, 25, 'next-monday')
                ];
                let boxing = new Date(Date.UTC(y, 11, 26));
                if (boxing.getUTCDay() === 6 || boxing.getUTCDay() === 0) boxing.setUTCDate(28);
                else if (boxing.getUTCDay() === 1) boxing.setUTCDate(27);
                holidays.push(boxing);
                return holidays.some(h => h && sameDate(dateObj, h));
            }

            if (marketId === 'newyork') {
                const holidays = [
                    getObservedDate(y, 0, 1, 'weekend-shift'),
                    getNthDayOfMonth(y, 0, 1, 3),
                    getNthDayOfMonth(y, 1, 1, 3),
                    goodFriday,
                    getLastDayOfWeekOfMonth(y, 4, 1),
                    getObservedDate(y, 5, 19, 'weekend-shift'),
                    getObservedDate(y, 6, 4, 'weekend-shift'),
                    getNthDayOfMonth(y, 8, 1, 1),
                    getNthDayOfMonth(y, 10, 4, 4),
                    getObservedDate(y, 11, 25, 'weekend-shift')
                ];
                return holidays.some(h => h && sameDate(dateObj, h));
            }

            if (marketId === 'saopaulo') {
                const carnivalMon = new Date(easter.getTime() - 48 * 86400000);
                const carnivalTue = new Date(easter.getTime() - 47 * 86400000);
                const corpusChristi = new Date(easter.getTime() + 60 * 86400000);
                const holidays = [
                    new Date(Date.UTC(y, 0, 1)), carnivalMon, carnivalTue, goodFriday,
                    new Date(Date.UTC(y, 3, 21)), new Date(Date.UTC(y, 4, 1)), corpusChristi,
                    new Date(Date.UTC(y, 6, 9)), new Date(Date.UTC(y, 8, 7)), new Date(Date.UTC(y, 9, 12)),
                    new Date(Date.UTC(y, 10, 2)), new Date(Date.UTC(y, 10, 15)), new Date(Date.UTC(y, 10, 20)),
                    new Date(Date.UTC(y, 11, 24)), new Date(Date.UTC(y, 11, 25)), new Date(Date.UTC(y, 11, 31))
                ];
                return holidays.some(h => h && sameDate(dateObj, h));
            }

            if (marketId === 'london') {
                const holidays = [
                    getObservedDate(y, 0, 1, 'next-monday'), goodFriday, easterMonday,
                    getNthDayOfMonth(y, 4, 1, 1), getLastDayOfWeekOfMonth(y, 4, 1),
                    getLastDayOfWeekOfMonth(y, 7, 1), getObservedDate(y, 11, 25, 'next-monday'),
                    getObservedDate(y, 11, 26, 'next-monday')
                ];
                return holidays.some(h => h && sameDate(dateObj, h));
            }

            if (marketId === 'frankfurt' || marketId === 'euronext') {
                const holidays = [
                    new Date(Date.UTC(y, 0, 1)), goodFriday, easterMonday,
                    new Date(Date.UTC(y, 4, 1)), new Date(Date.UTC(y, 11, 24)),
                    new Date(Date.UTC(y, 11, 25)), new Date(Date.UTC(y, 11, 26)),
                    new Date(Date.UTC(y, 11, 31))
                ];
                return holidays.some(h => h && sameDate(dateObj, h));
            }

            if (marketId === 'six') {
                const ascDay = new Date(easter.getTime() + 39 * 86400000);
                const whitMon = new Date(easter.getTime() + 50 * 86400000);
                const holidays = [
                    new Date(Date.UTC(y, 0, 1)), new Date(Date.UTC(y, 0, 2)), goodFriday, easterMonday, ascDay, whitMon,
                    new Date(Date.UTC(y, 4, 1)), new Date(Date.UTC(y, 7, 1)),
                    new Date(Date.UTC(y, 11, 25)), new Date(Date.UTC(y, 11, 26)), new Date(Date.UTC(y, 11, 31))
                ];
                return holidays.some(h => h && sameDate(dateObj, h));
            }

            if (marketId === 'sydney') {
                const holidays = [
                    getObservedDate(y, 0, 1, 'next-monday'), getObservedDate(y, 0, 26, 'next-monday'),
                    goodFriday, easterMonday, new Date(Date.UTC(y, 3, 25)),
                    getNthDayOfMonth(y, 5, 1, 2), getObservedDate(y, 11, 25, 'next-monday'),
                    getObservedDate(y, 11, 26, 'next-monday')
                ];
                return holidays.some(h => h && sameDate(dateObj, h));
            }

            if (marketId === 'tokyo') {
                const holidays = [
                    new Date(Date.UTC(y, 0, 1)), new Date(Date.UTC(y, 0, 2)), new Date(Date.UTC(y, 0, 3)),
                    getNthDayOfMonth(y, 0, 1, 2), new Date(Date.UTC(y, 1, 11)), new Date(Date.UTC(y, 1, 23)),
                    new Date(Date.UTC(y, 3, 29)), new Date(Date.UTC(y, 4, 3)), new Date(Date.UTC(y, 4, 4)),
                    new Date(Date.UTC(y, 4, 5)), getNthDayOfMonth(y, 6, 1, 3), new Date(Date.UTC(y, 7, 11)),
                    getNthDayOfMonth(y, 8, 1, 3), getNthDayOfMonth(y, 9, 1, 2), new Date(Date.UTC(y, 10, 3)),
                    new Date(Date.UTC(y, 10, 23)), new Date(Date.UTC(y, 11, 31))
                ];
                return holidays.some(h => h && sameDate(dateObj, h));
            }

            return false;
        }

        function toUTCDateOnly(d) { return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
        function isTradingDay(dayDate, market) {
            if ((market.weekendDays || [0, 6]).includes(dayDate.getUTCDay())) return false;
            if (isMarketHoliday(dayDate, market.id)) return false;
            return true;
        }
        function isTradingDayForSession(dayDate, session, market) {
            return isTradingDay(session.close <= session.open ? new Date(dayDate.getTime() + 86400000) : dayDate, market);
        }
        function sessionTimes(dayDate, session) {
            const openTime = new Date(dayDate.getTime()); openTime.setUTCHours(Math.floor(session.open), Math.round((session.open % 1) * 60), 0, 0);
            const closeTime = new Date(dayDate.getTime());
            if (session.close <= session.open) closeTime.setUTCDate(closeTime.getUTCDate() + 1);
            closeTime.setUTCHours(Math.floor(session.close), Math.round((session.close % 1) * 60), 0, 0);
            return { open: openTime, close: closeTime };
        }
        function isSessionCurrentlyOpen(market, session, now) {
            const today = toUTCDateOnly(now), yesterday = new Date(today.getTime() - 86400000);
            if (isTradingDayForSession(yesterday, session, market)) { const c = sessionTimes(yesterday, session); if (now >= c.open && now < c.close) return true; }
            if (isTradingDayForSession(today, session, market)) { const c = sessionTimes(today, session); if (now >= c.open && now < c.close) return true; }
            return false;
        }

        function calculateMarketStatus(market, now) {
            const today = toUTCDateOnly(now), yesterday = new Date(today.getTime() - 86400000), candidates = [];
            const isHolidayToday = isMarketHoliday(today, market.id);
            market.sessions.forEach(s => {
                if (isTradingDayForSession(yesterday, s, market)) candidates.push(sessionTimes(yesterday, s));
                if (isTradingDayForSession(today, s, market)) candidates.push(sessionTimes(today, s));
            });
            for (const c of candidates) { if (now >= c.open && now < c.close) return { isOpen: true, diffMs: c.close.getTime() - now.getTime(), isHolidayToday }; }
            const futureOpens = candidates.map(c => c.open.getTime()).filter(t => t > now.getTime());
            if (futureOpens.length) return { isOpen: false, diffMs: Math.min(...futureOpens) - now.getTime(), isHolidayToday };
            for (let i = 1; i <= 8; i++) {
                const d = new Date(today.getTime() + i * 86400000);
                const opens = market.sessions.filter(s => isTradingDayForSession(d, s, market)).map(s => sessionTimes(d, s).open.getTime());
                if (opens.length) return { isOpen: false, diffMs: Math.min(...opens) - now.getTime(), isHolidayToday };
            }
            return { isOpen: false, diffMs: 0, isHolidayToday };
        }

        function updateClock() {
            const now = new Date(), h = now.getUTCHours(), m = now.getUTCMinutes(), s = now.getUTCSeconds(), ms = now.getUTCMilliseconds();
            const currentDecimalHour = h + (m / 60) + (s / 3600);
            document.getElementById('hourHand').style.transform = `rotate(${currentDecimalHour * 15}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${(m + s / 60 + ms / 60000) * 6}deg)`;
            document.getElementById('secondHand').style.transform = `rotate(${(s + ms / 1000) * 6}deg)`;

            const t = i18n[currentLang];

            markets.forEach(market => {
                market.sessions.forEach((session, sIdx) => {
                    const arcEl = document.getElementById(`arc-${market.id}-${sIdx}`);
                    if (!arcEl) return;
                    if (isSessionCurrentlyOpen(market, session, now)) {
                        arcEl.classList.remove('closed'); arcEl.style.stroke = arcEl.getAttribute('data-color');
                    } else { arcEl.classList.add('closed'); arcEl.style.stroke = ''; }
                });

                const status = calculateMarketStatus(market, now);
                const cardEl = document.getElementById(`card-${market.id}`);
                const badgeEl = document.getElementById(`badge-${market.id}`);
                const labelEl = document.getElementById(`label-${market.id}`);
                const timerEl = document.getElementById(`timer-${market.id}`);

                const totalS = Math.floor(status.diffMs / 1000);
                const isClosingSoon = status.isOpen && totalS <= 300; // 5 minutos

                if (status.isOpen) {
                    cardEl.className = 'market-card card-open' + (isClosingSoon ? ' card-closing-soon' : '');
                    badgeEl.textContent = t.open;
                    labelEl.textContent = t.closesIn;
                } else if (status.isHolidayToday) {
                    cardEl.className = 'market-card card-closed card-holiday';
                    badgeEl.textContent = t.holiday;
                    labelEl.textContent = t.opensIn;
                } else {
                    cardEl.className = 'market-card card-closed';
                    badgeEl.textContent = t.closed;
                    labelEl.textContent = t.opensIn;
                }

                // Pisca o arco do relógio quando faltam ≤5 min para fechar
                market.sessions.forEach((session, sIdx) => {
                    const arcEl = document.getElementById(`arc-${market.id}-${sIdx}`);
                    if (!arcEl) return;
                    if (isClosingSoon) {
                        arcEl.classList.add('arc-closing-soon');
                    } else {
                        arcEl.classList.remove('arc-closing-soon');
                    }
                });

                // Timer com cor urgente
                if (isClosingSoon) {
                    timerEl.classList.add('countdown-timer-urgent');
                } else {
                    timerEl.classList.remove('countdown-timer-urgent');
                }

                const d = Math.floor(totalS / 86400), hh = Math.floor((totalS % 86400) / 3600), mm = Math.floor((totalS % 3600) / 60), ss = totalS % 60;
                timerEl.textContent = (d > 0 ? `${d}d ` : '') + `${hh.toString().padStart(2, '0')}h ${mm.toString().padStart(2, '0')}m ${ss.toString().padStart(2, '0')}s`;
                checkMarketAlarms(market, status, totalS, now);
            });
            requestAnimationFrame(updateClock);
        }

        function setupSettingsBar() {
            const toggleBtn = document.getElementById('settingsBtn');
            const dropdown = document.getElementById('settingsMenu');

            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('show');
            });

            document.addEventListener('click', (e) => {
                if (!document.getElementById('settingsContainer').contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });

            const langSelect = document.getElementById('langSelect');
            langSelect.value = currentLang;
            langSelect.addEventListener('change', (e) => {
                currentLang = e.target.value;
                localStorage.setItem('r3r_lang_v4', currentLang);
                updateUITexts();
            });

            const skinSelect = document.getElementById('skinSelect');
            const savedSkin = localStorage.getItem('r3r_skin') || 'skin-classic';
            document.body.className = savedSkin;
            skinSelect.value = savedSkin;
            skinSelect.addEventListener('change', (e) => {
                const chosenSkin = e.target.value;
                document.body.className = chosenSkin;
                localStorage.setItem('r3r_skin', chosenSkin);
            });

            const tzSelect = document.getElementById('tzSelect');
            let tzOptionsHTML = '';
            for (let off = -12; off <= 14; off++) {
                tzOptionsHTML += `<option value="${off}" ${off === 0 ? 'selected' : ''}>${off === 0 ? 'UTC+0' : `UTC${off > 0 ? '+' : ''}${off}`}</option>`;
            }
            tzSelect.innerHTML = tzOptionsHTML;
            tzSelect.addEventListener('change', (e) => { tzOffset = parseInt(e.target.value, 10); renderDial(); });

            const volumeRange = document.getElementById('volumeRange');
            volumeRange.addEventListener('input', (e) => { alarmVolume = parseFloat(e.target.value); });
            volumeRange.addEventListener('change', () => { try { playSoftChime(); } catch (e) { } });

            document.getElementById('layoutSelect').addEventListener('change', (e) => { document.body.classList.toggle('cards-only', e.target.value === 'cards'); });
            document.getElementById('toggleCards').addEventListener('change', (e) => { document.body.classList.toggle('hide-cards', !e.target.checked); });
        }

        initInterface();
        updateUITexts();
        setupSettingsBar();
        setupAlarmControls();
        updateClock();
    </script>
