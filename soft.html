<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R3R Clock — Soft Palette A/B Test</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #clockFrame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .ab-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 999999;
            display: flex;
            gap: 6px;
            padding: 6px;
            border: 1px solid #3b414a;
            border-radius: 9px;
            background: rgba(10, 13, 18, 0.88);
            backdrop-filter: blur(8px);
        }
        .ab-panel button {
            min-height: 34px;
            padding: 5px 10px;
            border: 1px solid #454c56;
            border-radius: 6px;
            background: #11151b;
            color: #c8cdd4;
            font-weight: 700;
            cursor: pointer;
        }
        .ab-panel button.active {
            border-color: #b78957;
            color: #d6b184;
        }
    </style>
</head>
<body>
    <iframe id="clockFrame" src="./index.html" title="R3R Clock"></iframe>
    <div class="ab-panel" aria-label="Comparação de paleta">
        <button id="originalBtn" type="button">ORIGINAL</button>
        <button id="softBtn" type="button" class="active">SOFT</button>
    </div>

    <script>
        const frame = document.getElementById('clockFrame');
        const originalBtn = document.getElementById('originalBtn');
        const softBtn = document.getElementById('softBtn');
        const STYLE_ID = 'r3r-soft-palette-test-style';

        const softCSS = `
            /* Força a comparação em QUALQUER skin, inclusive NYSE Wall St. */
            body {
                --bg-color: #0a0d12 !important;
                --text-main: #c9ced6 !important;
                --text-dim: #727b87 !important;
                --panel-bg: #11161d !important;
                --panel-border: #2a323d !important;
                --accent-color: #ad713c !important;
                --accent-orange: #c3915c !important;
                --clock-ring: #9f6b3d !important;
                --tick-main: #b8bec7 !important;
                --tick-sub: #343c47 !important;
            }

            #clockSvg .market-arc:not(.closed) {
                opacity: 0.52 !important;
            }
            #clockSvg .market-arc.closed {
                stroke: #262d36 !important;
                opacity: 0.92 !important;
            }
            #clockSvg .guide-ring {
                stroke: #252d36 !important;
                opacity: 0.72 !important;
            }
            #clockSvg .preopen-arc {
                stroke: #5b6570 !important;
                opacity: 0.48 !important;
            }
            #clockSvg .sun-icon {
                opacity: 0.62 !important;
            }
            #clockSvg .arc-text {
                fill: #c8cdd4 !important;
                opacity: 0.82 !important;
            }
            #clockSvg .hour-text,
            #clockSvg .minute-text,
            #clockSvg .center-numbers {
                opacity: 0.82 !important;
            }
            #clockSvg #secondHand {
                opacity: 0.58 !important;
            }

            .market-card .swatch {
                opacity: 0.52 !important;
            }
            .card-open .status-badge {
                background: #17231b !important;
                color: #7ea18a !important;
                border-color: #385041 !important;
            }
            .card-closed .status-badge {
                background: #241a1a !important;
                color: #b67d7d !important;
                border-color: #5f4141 !important;
            }
            .card-holiday .status-badge {
                background: #292217 !important;
                color: #c49e6c !important;
                border-color: #665332 !important;
            }
            .countdown-timer {
                color: #829eaa !important;
            }
            .card-open .countdown-timer {
                color: #bd925f !important;
            }
            .market-card:hover,
            body.skin-nyse .market-card:hover {
                box-shadow: none !important;
            }
            body.skin-nyse .arc-closing-soon,
            body.skin-nyse .card-closing-soon,
            body.skin-nyse .card-closing-soon .status-badge {
                animation: none !important;
            }
        `;

        function setMode(mode) {
            const doc = frame.contentDocument;
            if (!doc) return;
            let style = doc.getElementById(STYLE_ID);

            if (mode === 'soft') {
                if (!style) {
                    style = doc.createElement('style');
                    style.id = STYLE_ID;
                    style.textContent = softCSS;
                    doc.head.appendChild(style);
                }
                softBtn.classList.add('active');
                originalBtn.classList.remove('active');
            } else {
                if (style) style.remove();
                originalBtn.classList.add('active');
                softBtn.classList.remove('active');
            }
        }

        frame.addEventListener('load', () => setMode('soft'));
        originalBtn.addEventListener('click', () => setMode('original'));
        softBtn.addEventListener('click', () => setMode('soft'));
    </script>
</body>
</html>
